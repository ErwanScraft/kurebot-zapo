#
#              K U R E B O T
#        WhatsApp Bot Configuration
#
# KureBot adalah bot WhatsApp multi-fungsi yang
# dirancang untuk kebutuhan komunitas, utilitas,
# downloader media, dan berbagai fitur otomatisasi.
#
# Copy this file to config.yml and replace
# all template values with your actual configuration.
#
# ==================================================

# ==================================================
# Language Configuration
# Available languages: id-ID (Bahasa Indonesia)
# ==================================================

language: "id-ID"

# ==================================================
# Database Configuration
# Supported drivers: mysql
# ==================================================

database:
  type: "mysql"

mysql_store:
  host: "your-database-host"
  port: 3306
  database: "your-store-database"
  username: "your-database-username"
  password: "your-database-password"
  timezone: "your-timezone"
  pool:
    connection_limit: 10

mysql_data:
  host: "your-database-host"
  port: 3306
  database: "your-data-database"
  username: "your-database-username"
  password: "your-database-password"
  timezone: "your-timezone"
  pool:
    connection_limit: 10

# ==================================================
# BOT Configuration
# ==================================================

bot:
  prefix: "."

# ==================================================
# SEASON Configuration
# ==================================================

season:
  pino:
    level: "silent"

# ==================================================
# Minecraft Webhook
# ==================================================

webhook:
  minecraft:
    enabled: false
    host: "0.0.0.0"
    port: 8018

    # Must match the webhook secret configured
    # on the Minecraft plugin.
    secret: "your-webhook-secret"

    # WhatsApp JIDs that receive Minecraft events.
    targets:
      - "your-whatsapp-group-jid@g.us"

    events:
      # Player lifecycle events.
      "player.join": true
      "player.first_join": true
      "player.leave": true

    messages:
      # Message templates for player lifecycle events.
      "player.join": "🟢 {player} joined the server."
      "player.first_join": "🎉 {player} joined the server for the first time."
      "player.leave": "🔴 {player} left the server."

# ==================================================
# Versi Konfigurasi (Jangan Diubah)
# ==================================================

config: "0.0.1"